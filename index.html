        window.SettingStore = {
            migrate: function() {
                for (var legacy in window.SETTING_LEGACY_KEYS) {
                    var next = window.SETTING_LEGACY_KEYS[legacy];
                    if (localStorage.getItem(next) === null) {
                        var legacyValue = localStorage.getItem(legacy);

            resolveKey: function(key) {
                return window.SETTING_LEGACY_KEYS[key] || key;

            keys: function() {
                var result = [];

                        result.push(key);
                    }

                return result;
            },
            getAll: function() {
                var result = {};
                this.keys().forEach(function(key) {
                    result[key] = localStorage.getItem(key);
                });
                return result;
            },
            set: function(key, value) {
                localStorage.setItem(this.resolveKey(key), value);
            },
            get: function(key) {
                return localStorage.getItem(this.resolveKey(key));
            },
            remove: function(key) {
                localStorage.removeItem(this.resolveKey(key));
            },

                this.keys().forEach(function(key) {

                        }

                        var darkValues = data.dark || null;

    <script>
        window.gameState = {
            gpuAccelerationEnabled: true,
            tileAnimationEnabled: true,
            tileAppearAnimationEnabled: true,
            tileMoveAnimationEnabled: true,
            tileMergeAnimationEnabled: true,
            scorePopAnimationEnabled: true,
            vibrationEnabled: true,
            vibrationMergeEnabled: true,
            vibrationWinEnabled: true,
            vibrationLossEnabled: true,
            grid: [],
            gridSize: 4,
            gridRows: 4,
            gridCols: 4,
            score: 0,
            bestScore: 0,
            gameOver: false,
            gameWon: false,
            isEndlessMode: false,
            isPaused: false,
            difficulty: 'medium',
            history: [],
            touchStartX: 0,
            touchStartY: 0,
            touchEndX: 0,
            touchEndY: 0
        };
        window.settingsManager.loadTo(gameState);
        let lastFocusedElement = null;
        const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
        let isDebugMode = false;
        let simulateNoVibration = false;
        Object.defineProperty(window, 'gameVersions', {
            get: function() {
                let output = '';
                if (window.gameVersion) {
                    output += '2048 Game v' + window.gameVersion + '\n';
                }
                if (window.cssVersion) {
                    output += '2048 CSS v' + window.cssVersion + '\n';
                }
                for (const prop in window) {
                    if (prop !== 'gameVersion' && prop !== 'cssVersion' && prop.endsWith('Version') && window[prop] && typeof window[prop] !== 'function') {
                        const moduleName = prop.replace(/Version$/, '').replace(/^([a-z])/, (m, c) => c.toUpperCase()).replace(/([A-Z])/g, ' $1').trim();
                        output += moduleName + ' v' + window[prop] + '\n';
                    }
                }
                console.log(output.trim());
                return 'Version info displayed above';
            }
        });
        Object.defineProperty(window, 'gameDebug', {
            get: function() {
                isDebugMode = !isDebugMode;
                console.log(`Debug mode ${isDebugMode ? 'enabled' : 'disabled'}`);
                if (isDebugMode) {
                    console.log('Debug commands:\n- "novib" - Simulate no vibration support\n- "vib" - Restore vibration support\n- "rotatehint" - Show the rotate-to-portrait hint\n- "win" - Trigger game win\n- "loss" - Trigger game over\n- "exitDebug" - Exit debug mode');
                }
                return 'Debug mode command executed';
            }
        });
        Object.defineProperty(window, 'novib', {
            get: function() {
                if (isDebugMode) {
                    simulateNoVibration = true;
                    console.log('Simulating no vibration support');
                    const vibrationToggle = document.getElementById('vibration-toggle');
                    const vibrationWarningContainer = document.getElementById('vibration-warning-container');
                    const vibrationDetails = document.getElementById('vibration-details');
                    if (vibrationToggle) {
                        vibrationToggle.disabled = true;
                        vibrationToggle.checked = false;
                        gameState.vibrationEnabled = false;
                        localStorage.setItem('2048-setting-vibration', gameState.vibrationEnabled);
                        vibrationToggle.closest('.vibration-toggle-container').classList.add('opacity-50');
                        vibrationToggle.closest('.vibration-toggle-container').classList.remove('mb-2');
                        if (vibrationWarningContainer) {
                            vibrationWarningContainer.classList.remove('hidden');
                        }
                        if (vibrationDetails) {
                            vibrationDetails.classList.add('opacity-50');
                            vibrationDetails.classList.add('collapsed');
                        }
                    }
                    return 'No vibration simulation enabled';
                } else {
                    console.log('Please enable debug mode first with gameDebug');
                    return 'Debug mode not enabled';
                }
            }
        });
        Object.defineProperty(window, 'vib', {
            get: function() {
                if (isDebugMode) {
                    simulateNoVibration = false;
                    console.log('Restoring vibration support');
                    const vibrationToggle = document.getElementById('vibration-toggle');
                    const vibrationWarningContainer = document.getElementById('vibration-warning-container');
                    const vibrationDetails = document.getElementById('vibration-details');
                    if (vibrationToggle) {
                        vibrationToggle.disabled = false;
                        vibrationToggle.checked = true;
                        gameState.vibrationEnabled = true;
                        localStorage.setItem('2048-setting-vibration', gameState.vibrationEnabled);
                        vibrationToggle.closest('.vibration-toggle-container').classList.remove('opacity-50');
                        vibrationToggle.closest('.vibration-toggle-container').classList.add('mb-2');
                        if (vibrationWarningContainer) {
                            vibrationWarningContainer.classList.add('hidden');
                        }
                        if (vibrationDetails) {
                            vibrationDetails.classList.remove('opacity-50');
                            vibrationDetails.classList.remove('collapsed');
                        }
                    }
                    return 'Vibration support restored';
                } else {
                    console.log('Please enable debug mode first with gameDebug');
                    return 'Debug mode not enabled';
                }
            }
        });
        Object.defineProperty(window, 'rotatehint', {
            get: function() {
                if (isDebugMode) {
                    if (typeof window.showRotateHint === 'function') {
                        window.showRotateHint();
                        console.log('Rotate hint shown');
                        return 'Rotate hint shown';
                    } else {
                        console.log('Fullscreen mode module not initialized');
                        return 'Fullscreen mode module not initialized';
                    }
                } else {
                    console.log('Please enable debug mode first with gameDebug');
                    return 'Debug mode not enabled';
                }
            }
        });
        Object.defineProperty(window, 'win', {
            get: function() {
                if (isDebugMode) {
                    gameState.gameWon = true;
                    if (!gameState.isEndlessMode) {
                        showGameMessage("gameWon", "gameWonText");
                        vibrate([100, 50, 100], 'win');
                    }
                    console.log('Game won triggered');
                    return 'Game won triggered';
                } else {
                    console.log('Please enable debug mode first with gameDebug');
                    return 'Debug mode not enabled';
                }
            }
        });
        Object.defineProperty(window, 'loss', {
            get: function() {
                if (isDebugMode) {
                    gameState.gameOver = true;
                    showGameMessage("gameOver", "gameOverText");
                    vibrate([50, 50, 50, 50, 50], 'loss');
                    console.log('Game over triggered');
                    return 'Game over triggered';
                } else {
                    console.log('Please enable debug mode first with gameDebug');
                    return 'Debug mode not enabled';
                }
            }
        });
        Object.defineProperty(window, 'exitDebug', {
            get: function() {
                if (isDebugMode) {
                    isDebugMode = false;
                    console.log('Debug mode disabled');
                    return 'Debug mode disabled';
                } else {
                    console.log('Debug mode is already disabled');
                    return 'Debug mode already disabled';
                }
            }
        });
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
        };
        function handleModalKeyDown(e) {
            const modalId = e.currentTarget.id;
            if (e.key === 'Escape') {
                if (modalId === 'pause-menu') {
                    togglePause();
                    e.stopPropagation();
                } else {
                    hideModal(modalId);
                }
            } else if (e.key === 'Tab') {
                const focusable = Array.from(e.currentTarget.querySelectorAll(focusableElements));
                const currentIndex = focusable.indexOf(document.activeElement);
                if (focusable.length > 0) {
                    if (e.shiftKey) {
                        const prevIndex = (currentIndex - 1 + focusable.length) % focusable.length;
                        focusable[prevIndex].focus();
                    } else {
                        const nextIndex = (currentIndex + 1) % focusable.length;
                        focusable[nextIndex].focus();
                    }
                    e.preventDefault();
                }
            } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const focusable = Array.from(e.currentTarget.querySelectorAll(focusableElements));
                const currentIndex = focusable.indexOf(document.activeElement);
                if (focusable.length > 0) {
                    let nextIndex = currentIndex;
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                        nextIndex = (currentIndex + 1) % focusable.length;
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                        nextIndex = (currentIndex - 1 + focusable.length) % focusable.length;
                    }
                    focusable[nextIndex].focus();
                    e.preventDefault();
                }
            }
        }
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                lastFocusedElement = document.activeElement;
                modal.classList.remove('modal-backdrop-fade-out');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.querySelector('div').classList.remove('scale-95', 'opacity-0');
                    modal.querySelector('div').classList.add('scale-100', 'opacity-100');
                    const focusable = modal.querySelectorAll(focusableElements);
                    if (focusable.length > 0 && !modal.dataset.noAutofocus) {
                        focusable[0].focus();
                    }
                    modal.addEventListener('keydown', handleModalKeyDown);
                }, 10);
            }
        }
        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('modal-backdrop-fade-out');
                modal.querySelector('div').classList.remove('scale-100', 'opacity-100');
                modal.querySelector('div').classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('modal-backdrop-fade-out');
                    if (lastFocusedElement && document.contains(lastFocusedElement)) {
                        lastFocusedElement.focus();
                    }
                    modal.removeEventListener('keydown', handleModalKeyDown);
                }, 300);
            }
        }
        (function setupModalScrollLock() {
            const lockClass = 'modal-scroll-lock';
            const aiModalId = 'ai-analysis-modal';
            function update() {
                const anyOpen = Array.from(document.querySelectorAll('[role="dialog"]')).some(modal =>
                    modal.id !== aiModalId && !modal.classList.contains('hidden')
                );
                document.body.classList.toggle(lockClass, anyOpen);
            }
            function bind() {
                const observer = new MutationObserver(update);
                document.querySelectorAll('[role="dialog"]').forEach(modal => {
                    observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
                });
                update();
            }
            window.refreshModalScrollLock = bind;
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bind);
            } else {
                bind();
            }
        })();
        function importGameData(dataStr) {
            try {
                if (!dataStr) {
                    console.error(i18n.t('consoleDataEmpty'));
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedEmpty'));
                }
                let decodedData;
                let data;
                try {
                    decodedData = atob(dataStr);
                    data = JSON.parse(decodedData);
                } catch (e) {
                    console.error(i18n.t('consoleBase64Failed'), e);
                    try {
                        decodedData = Base91.decode(dataStr);
                        data = JSON.parse(decodedData);
                    } catch (e2) {
                        console.error(i18n.t('consoleBase91Failed'), e2);
                        throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedDecode'));
                    }
                }
                if (!data || typeof data !== 'object') {
                    console.error(i18n.t('consoleInvalidObject'), { data: data, type: typeof data });
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedObject'));
                }
                const requiredFields = ['grid', 'score', 'bestScore', 'gridSize', 'difficulty', 'isEndlessMode'];
                const missingFields = requiredFields.filter(field => !(field in data));
                if (missingFields.length > 0) {
                    console.error(i18n.t('consoleMissingFields'), { missingFields: missingFields, data: data });
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedFields', { fields: missingFields.join(', ') }));
                }
                if (!Array.isArray(data.grid) || data.grid.length === 0) {
                    console.error(i18n.t('consoleInvalidGrid'), { grid: data.grid, isArray: Array.isArray(data.grid) });
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedGrid'));
                }
                const gridRows = data.gridRows || data.gridSize;
                const gridCols = data.gridCols || data.gridSize;
                if (data.grid.length !== gridRows || data.grid.some(row => row.length !== gridCols)) {
                    console.error(i18n.t('consoleSizeMismatch'), { 
                        gridLength: data.grid.length, 
                        gridRows: gridRows, 
                        gridCols: gridCols,
                        rowLengths: data.grid.map(row => row.length)
                    });
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedSize'));
                }
                const invalidTiles = data.grid.flatMap(row => row.filter(tile => tile && (tile.value <= 0 || (tile.value & (tile.value - 1)) !== 0)));
                if (invalidTiles.length > 0) {
                    console.error(i18n.t('consoleInvalidTiles'), { invalidTiles: invalidTiles });
                    throw new Error(i18n.t('importFailed') + ' ' + i18n.t('importFailedTiles'));
                }
                const shouldImportSettings = data.settings && confirm(i18n.t('confirmImportSettings'));
                gameState.grid = data.grid;
                gameState.score = data.score;
                gameState.bestScore = data.bestScore;
                gameState.gridSize = data.gridSize;
                gameState.gridRows = gridRows;
                gameState.gridCols = gridCols;
                syncNextTileId();
                gameState.difficulty = data.difficulty;
                gameState.isEndlessMode = data.isEndlessMode;
                const gameContainer = document.querySelector('.game-container');
                gameContainer.classList.remove('grid-3x3', 'grid-4x4', 'grid-5x5');
                gameContainer.classList.add(`grid-${gridRows}x${gridCols}`);
                generateGridStyles(null, gridRows, gridCols);
                initGridContainer();
                updateDocumentTitle();
                renderAllTiles();
                elements.scoreDisplay.textContent = gameState.score;
                elements.bestScoreDisplay.textContent = gameState.bestScore;
                elements.modeDescription.textContent = i18n.t('modeDescription') + (gameState.isEndlessMode ? i18n.t('endlessModeDesc') : i18n.t('standardMode'));
                elements.difficultyDescription.textContent = i18n.t('difficultyDescription') + i18n.t(gameState.difficulty) + ` - ${gridRows}×${gridCols}` + i18n.t('grid');
                saveGameState();
                gameState.history = [];
                updateUndoButtonState();
                if (shouldImportSettings) {

                                    gameState.grid[y][newX + 1].value === gameState.grid[y][x].value &&
                                    !gameState.grid[y][newX + 1].merged) {
                                    handleTileMerge(y, newX + 1, y, x);
                                    moved = true;
                                } else if (newX !== x) {
                                    gameState.grid[y][newX] = gameState.grid[y][x];
                                    gameState.grid[y][x] = null;
                                    moved = true;
                                }
                            }
                        }
                    }
                    break;
            }
            if (moved) {
                if (gameState.tileAnimationEnabled) {
                    generateRandomTile(true);
                    renderAllTiles(true);
                    if (mergeTimer) clearTimeout(mergeTimer);
                    mergeTimer = setTimeout(() => {
                        for (let y = 0; y < gameState.gridRows; y++) {
                            for (let x = 0; x < gameState.gridCols; x++) {
                                if (gameState.grid[y][x] && gameState.grid[y][x].mergedAnimation) {
                                    gameState.grid[y][x].mergedAnimation = false;
                                    const tileElement = elements.tileContainer.querySelector(`.tile[data-tile-id="${gameState.grid[y][x].id}"]`);
                                    if (tileElement) {

                        }
                    }, 300);
                    if (moveTimer) clearTimeout(moveTimer);
                    moveTimer = setTimeout(() => {

                    }, config.animationDuration);
                } else {
                    generateRandomTile(false);
                    renderAllTiles(false);
                    if (moveTimer) clearTimeout(moveTimer);
                    moveTimer = setTimeout(() => {
                        if (!gameState.gameWon) {
                            checkWin();
                        }
                        if (!gameState.gameWon || gameState.isEndlessMode) {
                            checkGameOver();
                        }

                    }, 10);

        function vibrate(pattern = 50, type = 'merge') {
            let shouldVibrate = gameState.vibrationEnabled && navigator.vibrate && !simulateNoVibration;
            switch (type) {
                case 'merge':
                    shouldVibrate = shouldVibrate && gameState.vibrationMergeEnabled;
                    break;
                case 'win':
                    shouldVibrate = shouldVibrate && gameState.vibrationWinEnabled;
                    break;
                case 'loss':
                    shouldVibrate = shouldVibrate && gameState.vibrationLossEnabled;
                    break;
            }
            if (shouldVibrate) {
                navigator.vibrate(pattern);

        function scheduleScoreAddition(amount) {
            if (!gameState.scorePopAnimationEnabled || !amount || amount <= 0) {
                return;

            scoreAdditionBuffer += amount;
            if (scoreAdditionFrame === null) {
                scoreAdditionFrame = requestAnimationFrame(() => {
                    scoreAdditionFrame = null;
                    const total = scoreAdditionBuffer;
                    scoreAdditionBuffer = 0;
                    playScoreAddition(total);
                });
            }
        }
        function playScoreAddition(total) {
            const scoreDisplay = elements.scoreDisplay;
            if (!scoreDisplay) {
                return;
            }
            scoreDisplay.classList.remove('score-pop');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('score-pop');
            const existing = scoreDisplay.querySelector('.score-addition');
            if (existing) {
                existing.remove();
            }
            const addition = document.createElement('div');
            addition.className = 'score-addition';
            addition.textContent = '+' + total;
            scoreDisplay.appendChild(addition);
            const cleanup = () => addition.remove();
            addition.addEventListener('animationend', cleanup, { once: true });
            setTimeout(cleanup, 800);
        }
        function handleTileMerge(targetY, targetX, sourceY, sourceX) {
            const sourceTile = gameState.grid[sourceY][sourceX];
            const targetTile = gameState.grid[targetY][targetX];
            processMerge(gameState.grid, targetY, targetX, sourceY, sourceX, {
                scoreMultiplier: config.difficultySettings[gameState.difficulty]?.scoreMultiplier || 1,
                onScoreUpdate: (addedScore) => {
                    gameState.score += addedScore;
                    if (gameState.score > gameState.bestScore) {
                        gameState.bestScore = gameState.score;
                        elements.bestScoreDisplay.textContent = gameState.bestScore;
                    }
                    elements.scoreDisplay.textContent = gameState.score;
                    scheduleScoreAddition(addedScore);
                    updateDocumentTitle();
                },
                onMergeComplete: () => {
                    targetTile.mergedAnimation = true;
                    targetTile.mergedFrom = [sourceTile];
                    vibrate(50, 'merge');
                }
            });
        }
        function processMerge(grid, targetY, targetX, sourceY, sourceX, options = {}) {
            const { scoreMultiplier = 1, onScoreUpdate, onMergeComplete } = options;
            grid[targetY][targetX].value *= 2;
            grid[targetY][targetX].merged = true;
            const mergedTile = grid[targetY][targetX];
            grid[sourceY][sourceX] = null;
            if (onScoreUpdate) {
                onScoreUpdate(mergedTile.value * scoreMultiplier);
            }
            if (onMergeComplete) {
                onMergeComplete();
            }
            return mergedTile;
        }
        function checkWin() {
            for (let y = 0; y < gameState.gridRows; y++) {

                            showGameMessage("gameWon", "gameWonText");

        function checkGameOver() {

                    if (gameState.grid[y][x] === null) {
                        return false;
                    }
                }
            }
            for (let y = 0; y < gameState.gridRows; y++) {
                for (let x = 0; x < gameState.gridCols; x++) {
                    const value = gameState.grid[y][x].value;
                    if (x < gameState.gridCols - 1 && gameState.grid[y][x + 1] && gameState.grid[y][x + 1].value === value) {
                        return false;
                    }
                    if (y < gameState.gridRows - 1 && gameState.grid[y + 1][x] && gameState.grid[y + 1][x].value === value) {
                        return false;
                    }

        function findKeyConflicts() {
            const byKey = {};
            Object.keys(keyBindings).forEach(a => {
                const k = keyBindings[a];
                if (k) {
                    if (!byKey[k]) byKey[k] = [];
                    byKey[k].push(a);
                }
            });
            const conflicts = new Set();
            Object.values(byKey).forEach(actions => {
                if (actions.length > 1) {
                    actions.forEach(a => conflicts.add(a));
                }
            });
            return conflicts;

        function renderKeybindingsList() {

            list.innerHTML = '';
            const conflicts = findKeyConflicts();
            if (keyCaptureAction && conflicts.has(keyCaptureAction)) {
                const captureKey = keyBindings[keyCaptureAction];
                Object.keys(keyBindings).forEach(a => {
                    if (a !== keyCaptureAction && keyBindings[a] === captureKey) {
                        conflicts.delete(a);
                    }
                });
            }
            keyBindingActions.forEach(({ action, key }) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors';
                const labelSpan = document.createElement('span');
                labelSpan.className = 'text-sm text-gray-700 dark:text-dark-text';
                labelSpan.textContent = window.i18n ? i18n.t(key) : key;
                const isConflict = conflicts.has(action) && action !== keyCaptureAction;
                const btn = document.createElement('button');
                btn.className = isConflict
                    ? 'px-3 py-1 min-w-[64px] bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-300 border border-red-500 rounded-md text-sm font-mono transition-colors'
                    : 'px-3 py-1 min-w-[64px] bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md text-sm font-mono transition-colors hover:bg-gray-300 dark:hover:bg-gray-500';
                btn.textContent = formatKeyName(keyBindings[action]);
                btn.dataset.action = action;
                btn.addEventListener('click', () => startKeyCapture(action));
                row.appendChild(labelSpan);
                const wrap = document.createElement('span');
                wrap.className = 'flex items-center gap-1';
                if (isConflict) {
                    const icon = document.createElement('i');
                    icon.className = 'fa-solid fa-circle-exclamation text-red-500';
                    icon.title = i18n.t('keybindingConflict');
                    wrap.appendChild(icon);
                }
                if (action === 'undo') {
                    const prefix = document.createElement('span');
                    prefix.className = 'text-sm text-gray-500 dark:text-dark-muted font-mono';
                    prefix.textContent = 'Ctrl/⌘ +';
                    wrap.appendChild(prefix);
                }
                wrap.appendChild(btn);
                row.appendChild(wrap);

        function startKeyCapture(action) {
            cancelActiveKeyCapture();
            keyCaptureAction = action;
            renderKeybindingsList();
            const list = document.getElementById('keybindings-list');
            if (!list) return;
            const btn = list.querySelector(`button[data-action="${action}"]`);
            if (!btn) return;
            btn.textContent = i18n.t('pressKey');
            btn.classList.add('bg-primary', 'text-white', 'animate-pulse');
            const handler = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (['shift', 'control', 'alt', 'meta'].includes(e.key.toLowerCase())) return;
                document.removeEventListener('keydown', handler, true);
                if (activeKeyCaptureHandler === handler) activeKeyCaptureHandler = null;
                keyCaptureAction = null;
                if (e.key !== 'Escape') {
                    keyBindings[action] = e.key.toLowerCase();
                    if (findKeyConflicts().size === 0) {
                        saveKeyBindings();
                    }
                }
                renderKeybindingsList();

        function setupTouchListeners() {
            elements.gameContainer.addEventListener('touchstart', (e) => {
                if (gameState.isPaused || gameState.gameOver || (gameState.gameWon && !gameState.isEndlessMode)) return;
                gameState.touchStartX = e.touches[0].clientX;
                gameState.touchStartY = e.touches[0].clientY;
            }, { passive: false });
            elements.gameContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });
            elements.gameContainer.addEventListener('touchend', (e) => {
                if (gameState.isPaused || gameState.gameOver || (gameState.gameWon && !gameState.isEndlessMode)) return;
                gameState.touchEndX = e.changedTouches[0].clientX;
                gameState.touchEndY = e.changedTouches[0].clientY;
                const dx = gameState.touchEndX - gameState.touchStartX;
                const dy = gameState.touchEndY - gameState.touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (Math.abs(dx) > config.touchThreshold) {
                        move(dx > 0 ? 'right' : 'left');
                    }
                } else {
                    if (Math.abs(dy) > config.touchThreshold) {
                        move(dy > 0 ? 'down' : 'up');
                    }
                }
            }, { passive: true });

        function createConfirmButton(options) {
            const { buttonId, element, hasIcon, i18nKey, onConfirm, resetAll } = options;
            const state = { needsConfirm: false };
            const originalClassName = element.className;
            const originalIconClass = hasIcon ? element.querySelector('i').className : null;
            const originalHTML = element.innerHTML;
            function reset() {
                state.needsConfirm = false;
                element.className = originalClassName;
                if (hasIcon) {
                    const icon = element.querySelector('i');
                    if (icon) {
                        icon.className = originalIconClass;
                        icon.style.display = '';
                    }
                }
                element.innerHTML = originalHTML;
                const span = element.querySelector('span[data-i18n]');
                if (span) {
                    const key = span.getAttribute('data-i18n');
                    if (key) span.textContent = i18n.t(key);
                }
            }
            function handleClick() {
                if (state.needsConfirm) {
                    onConfirm();
                    resetAll();
                } else {
                    if (gameState.score > 0) {
                        resetAll();
                        state.needsConfirm = true;
                        if (hasIcon) {
                            const span = element.querySelector('span');
                            if (span) span.textContent = i18n.t('confirm');
                            const icon = element.querySelector('i');
                            if (icon) {
                                icon.className = 'fa-solid fa-exclamation-triangle mr-2';
                                icon.style.display = '';
                            }
                        } else {
                            element.innerHTML = i18n.t('confirm');
                        }
                        element.classList.add('confirm-pending');
                    } else {
                        onConfirm();
                    }
                }
            }
            element.addEventListener('click', handleClick);
            element.addEventListener('blur', () => {
                if (state.needsConfirm) {
                    resetAll();
                }
            });
            return { reset, state };
        }

                                if (x < gridCols-1 && grid[y][x+1] && grid[y][x+1].value > grid[y][x].value) {
                                    blockCount++;
                                }
                                break;
                        }
                    }
                }
            }
            const maxPossibleBlocks = (gridRows * (gridRows - 1)) + (gridCols * (gridCols - 1));
            return 10 - (blockCount / maxPossibleBlocks * 10);
        }
        function calculateMultiStepScore(state, initialDirection) {
            return minimaxSearch(state, 3, -Infinity, Infinity, true);
        }
        function minimaxSearch(state, depth, alpha, beta, isMaximizingPlayer) {
            if (depth === 0) {
                const emptyCells = countEmptyCells(state.grid);
                const merges = countMergeOpportunities(state.grid);
                const positionScore = calculatePositionScore(state.grid, state.gridSize);
                const uniformityScore = calculateUniformityScore(state.grid, state.gridSize);
                return (emptyCells * 2 + merges * 3 + positionScore + uniformityScore) / 10;
            }
            const directions = ['up', 'down', 'left', 'right'];
            if (isMaximizingPlayer) {
                let maxScore = -Infinity;
                directions.forEach(direction => {
                    const newState = {
                        grid: cloneGrid(state.grid),
                        score: state.score,
                        gridSize: state.gridSize
                    };
                    if (simulateMove(newState, direction)) {
                        const score = minimaxSearch(newState, depth - 1, alpha, beta, false);
                        maxScore = Math.max(maxScore, score);
                        alpha = Math.max(alpha, score);
                        if (beta <= alpha) return maxScore;
                    }
                });
                return maxScore;
            } else {
                let minScore = Infinity;
                const emptyPositions = [];
                const gridRows = state.grid.length;
                const gridCols = state.grid[0].length;
                for (let y = 0; y < gridRows; y++) {
                    for (let x = 0; x < gridCols; x++) {
                        if (!state.grid[y][x]) {
                            emptyPositions.push({x, y});
                        }
                    }
                }
                if (emptyPositions.length === 0) return 0;
                const randomPos = emptyPositions[Math.floor(Math.random() * emptyPositions.length)];
                const newState = {
                    grid: cloneGrid(state.grid),
                    score: state.score,
                    gridSize: state.gridSize
                };
                newState.grid[randomPos.y][randomPos.x] = {
                    value: Math.random() >= config.aiDefaultFourProbability ? 2 : 4,
                    merged: false
                };
                const score = minimaxSearch(newState, depth - 1, alpha, beta, true);
                minScore = Math.min(minScore, score);
                beta = Math.min(beta, score);
                if (beta <= alpha) return minScore;
                return minScore;
            }
        }
        function calculateMonotonicityScore(grid, gridSize) {
            let score = 0;
            const gridRows = grid.length;
            const gridCols = grid[0].length;
            for (let y = 0; y < gridRows; y++) {
                let rowIncreasing = true;
                let rowDecreasing = true;
                for (let x = 0; x < gridCols - 1; x++) {
                    const curr = grid[y][x] ? grid[y][x].value : 0;
                    const next = grid[y][x+1] ? grid[y][x+1].value : 0;
                    rowIncreasing = rowIncreasing && (curr <= next);
                    rowDecreasing = rowDecreasing && (curr >= next);
                }
                score += rowIncreasing || rowDecreasing ? 2 : 0;
            }
            for (let x = 0; x < gridCols; x++) {
                let colIncreasing = true;
                let colDecreasing = true;
                for (let y = 0; y < gridRows - 1; y++) {
                    const curr = grid[y][x] ? grid[y][x].value : 0;
                    const next = grid[y+1][x] ? grid[y+1][x].value : 0;
                    colIncreasing = colIncreasing && (curr <= next);
                    colDecreasing = colDecreasing && (curr >= next);
                }
                score += colIncreasing || colDecreasing ? 2 : 0;
            }
            return score;
        }
